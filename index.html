<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Job Aggregator</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#2563eb;
    color:white;
    padding:15px;
    text-align:center;
}

iframe{
    width:100%;
    height:90vh;
    border:none;
}

#offline{
    display:none;
    text-align:center;
    padding:50px;
}
</style>
</head>

<body>

<header>
    <h2>Job Aggregator</h2>
</header>

<div id="offline">
    <h2>⚠️ Der Job Aggregator ist momentan nicht erreichbar.</h2>
    <p>Bitte versuche es in ein paar Minuten erneut.</p>

    <a href="https://job-aggregator-web-bhsh.onrender.com/" target="_blank">
        Direkt öffnen
    </a>
</div>

<iframe
    id="frame"
    src="https://job-aggregator-web-bhsh.onrender.com/">
</iframe>

<script>
const iframe = document.getElementById("frame");

setTimeout(() => {
    // Wenn die Seite nach 8 Sekunden nicht geladen ist,
    // zeigen wir die Meldung.
    document.getElementById("offline").style.display="block";
},8000);

iframe.onload = () => {
    document.getElementById("offline").style.display="none";
};
</script>

</body>
</html>
